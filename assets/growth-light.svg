<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Illustration: marketing and CRM growing together. Both lines dip a little at times and then climb back up.">
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  .ln{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 2.6s cubic-bezier(.4,0,.2,1) forwards}
  .crm{animation-delay:.5s}
  .area{opacity:0;animation:fade .8s ease-out 2s forwards}
  .end{opacity:0;animation:fade .4s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}} @keyframes fade{to{opacity:1}}
  @media (prefers-reduced-motion: reduce){.ln{animation:none;stroke-dashoffset:0} .area,.end{animation:none;opacity:1}}
</style>
