<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="MD Easin Arafat Sumon. Dhaka, Bangladesh. Digital marketer first. Not a coder, I build with AI.">
<style>.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.rise{opacity:0;transform:translateY(8px);animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.cur{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
@keyframes t0{0%,0.00%{width:0} 11.67%,27.33%{width:291px} 33.33%,100%{width:0}}
@keyframes c0{0%,0.00%{transform:translateX(0)} 11.67%,27.33%{transform:translateX(291px)} 33.33%,100%{transform:translateX(0)}}
@keyframes v0{0%,0.00%{opacity:0} 0.00%,33.32%{opacity:1} 33.33%,100%{opacity:0}}
#r0{animation:t0 9.600000000000001s steps(22) infinite} #k0{animation:c0 9.600000000000001s steps(22) infinite, v0 9.600000000000001s linear infinite}
@keyframes t1{0%,33.33%{width:0} 45.00%,60.67%{width:371px} 66.67%,100%{width:0}}
@keyframes c1{0%,33.33%{transform:translateX(0)} 45.00%,60.67%{transform:translateX(371px)} 66.67%,100%{transform:translateX(0)}}
@keyframes v1{0%,33.32%{opacity:0} 33.33%,66.66%{opacity:1} 66.67%,100%{opacity:0}}
#r1{animation:t1 9.600000000000001s steps(28) infinite} #k1{animation:c1 9.600000000000001s steps(28) infinite, v1 9.600000000000001s linear infinite}
@keyframes t2{0%,66.67%{width:0} 78.33%,94.00%{width:517px} 100.00%,100%{width:0}}
@keyframes c2{0%,66.67%{transform:translateX(0)} 78.33%,94.00%{transform:translateX(517px)} 100.00%,100%{transform:translateX(0)}}
@keyframes v2{0%,66.66%{opacity:0} 66.67%,99.99%{opacity:1} 100.00%,100%{opacity:0}}
#r2{animation:t2 9.600000000000001s steps(39) infinite} #k2{animation:c2 9.600000000000001s steps(39) infinite, v2 9.600000000000001s linear infinite}
@media (prefers-reduced-motion: reduce){.rise{animation:none;opacity:1;transform:none} #r0{animation:none;width:9999px} [id^=k],[id^=r1],[id^=r2]{animation:none}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2027"/><stop offset="1" stop-color="#173540"/></linearGradient><clipPath id="cp0"><rect id="r0" x="64" y="186" width="0" height="34"/></clipPath><clipPath id="cp1"><rect id="r1" x="64" y="186" width="0" height="34"/></clipPath><clipPath id="cp2"><rect id="r2" x="64" y="186" width="0" height="34"/></clipPath></defs>
<rect width="1200" height="280" rx="16" fill="url(#bg)"/>
<text x="64" y="76" class="mono rise" font-size="15" fill="#7f98a1" style="animation-delay:.1s">Dhaka, Bangladesh</text>
<text x="64" y="138" class="sans rise" font-size="52" font-weight="600" fill="#e6f1f4" style="animation-delay:.2s">MD Easin Arafat Sumon</text>
<rect x="64" y="236" width="40" height="3" rx="1.5" fill="#4fb6d1" class="rise" style="animation-delay:.3s"/>
<text x="64" y="211" class="mono" font-size="22" fill="#4fb6d1" clip-path="url(#cp0)">Digital marketer first</text>
<rect id="k0" x="66" y="191" width="2" height="26" fill="#a7bcc4" opacity="0"/>
<text x="64" y="211" class="mono" font-size="22" fill="#4fb6d1" clip-path="url(#cp1)">Not a coder, I build with AI</text>
<rect id="k1" x="66" y="191" width="2" height="26" fill="#a7bcc4" opacity="0"/>
<text x="64" y="211" class="mono" font-size="22" fill="#4fb6d1" clip-path="url(#cp2)">Ideas, then prompts, then live products</text>
<rect id="k2" x="66" y="191" width="2" height="26" fill="#a7bcc4" opacity="0"/>
</svg>
