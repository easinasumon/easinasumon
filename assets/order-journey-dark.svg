<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pineapple CRM: how one order moves. Order comes in from the WooCommerce shop, the team calls and confirms, a courier is booked, the order is delivered, and the ad report shows which ad really sold.">
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-variant-numeric:tabular-nums}
  .progress{stroke-dasharray:920;stroke-dashoffset:920;animation:draw 3.6s linear 0.6s forwards}
  .dot{animation:travel 3.6s linear 0.6s forwards}
  .node{animation:lit .3s cubic-bezier(.2,.8,.2,1) forwards}
  .step{animation:litText .3s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes travel{to{transform:translateX(920px)}}
  @keyframes lit{to{fill:#4fb6d1;stroke:#4fb6d1}}
  @keyframes litText{to{fill:#4fb6d1}}
  @media (prefers-reduced-motion: reduce){
    .progress{animation:none;stroke-dashoffset:0} .dot{animation:none;transform:translateX(920px)}
    .node{animation:none;fill:#4fb6d1;stroke:#4fb6d1} .step{animation:none;fill:#4fb6d1}
  }
</style>
<rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="#0f2027" stroke="rgba(230,241,244,0.08)"/>
<text x="40" y="60" class="sans" font-size="24" font-weight="600" fill="#e6f1f4">Pineapple CRM</text>
<text x="40" y="88" class="sans" font-size="17" fill="#a7bcc4">How one order moves, from the shop to the ad report</text>
<text x="1160" y="60" class="mono" font-size="14" fill="#7f98a1" text-anchor="end">pineapple.webgrowths.com</text>
<line x1="140" y1="186" x2="1060" y2="186" stroke="#23404b" stroke-width="2"/>
<line class="progress" x1="140" y1="186" x2="1060" y2="186" stroke="#4fb6d1" stroke-width="2"/>
<text x="140" y="154" class="mono step" font-size="14" fill="#7f98a1" text-anchor="middle" style="animation-delay:0.60s">01</text>
<circle class="node" cx="140" cy="186" r="8" fill="#16303a" stroke="#2f5260" stroke-width="2" style="animation-delay:0.60s"/>
<text x="140" y="238" class="sans" font-size="19" font-weight="600" fill="#e6f1f4" text-anchor="middle">Order comes in</text>
<text x="140" y="266" class="sans" font-size="16" fill="#a7bcc4" text-anchor="middle">straight from WooCommerce</text>
<text x="370" y="154" class="mono step" font-size="14" fill="#7f98a1" text-anchor="middle" style="animation-delay:1.50s">02</text>
<circle class="node" cx="370" cy="186" r="8" fill="#16303a" stroke="#2f5260" stroke-width="2" style="animation-delay:1.50s"/>
<text x="370" y="238" class="sans" font-size="19" font-weight="600" fill="#e6f1f4" text-anchor="middle">Call and confirm</text>
<text x="370" y="266" class="sans" font-size="16" fill="#a7bcc4" text-anchor="middle">the team calls each buyer</text>
<text x="600" y="154" class="mono step" font-size="14" fill="#7f98a1" text-anchor="middle" style="animation-delay:2.40s">03</text>
<circle class="node" cx="600" cy="186" r="8" fill="#16303a" stroke="#2f5260" stroke-width="2" style="animation-delay:2.40s"/>
<text x="600" y="238" class="sans" font-size="19" font-weight="600" fill="#e6f1f4" text-anchor="middle">Courier booked</text>
<text x="600" y="266" class="sans" font-size="16" fill="#a7bcc4" text-anchor="middle">Steadfast, Pathao or RedX</text>
<text x="830" y="154" class="mono step" font-size="14" fill="#7f98a1" text-anchor="middle" style="animation-delay:3.30s">04</text>
<circle class="node" cx="830" cy="186" r="8" fill="#16303a" stroke="#2f5260" stroke-width="2" style="animation-delay:3.30s"/>
<text x="830" y="238" class="sans" font-size="19" font-weight="600" fill="#e6f1f4" text-anchor="middle">Delivered</text>
<text x="830" y="266" class="sans" font-size="16" fill="#a7bcc4" text-anchor="middle">cash and returns tracked</text>
<text x="1060" y="154" class="mono step" font-size="14" fill="#7f98a1" text-anchor="middle" style="animation-delay:4.20s">05</text>
<circle class="node" cx="1060" cy="186" r="8" fill="#16303a" stroke="#2f5260" stroke-width="2" style="animation-delay:4.20s"/>
<text x="1060" y="238" class="sans" font-size="19" font-weight="600" fill="#e6f1f4" text-anchor="middle">Ad report</text>
<text x="1060" y="266" class="sans" font-size="16" fill="#a7bcc4" text-anchor="middle">which ad really sold</text>
<g class="dot"><circle cx="140" cy="186" r="16" fill="rgba(79,182,209,0.20)"/><circle cx="140" cy="186" r="6" fill="#4fb6d1"/></g>
</svg>
