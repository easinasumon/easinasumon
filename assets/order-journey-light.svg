<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pineapple CRM: how one order moves. Order comes in from the WooCommerce shop, the team calls and confirms, a courier is booked, the order is delivered, and the ad report shows which ad really sold.">
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-variant-numeric:tabular-nums}
  .progress{stroke-dasharray:880;stroke-dashoffset:880;animation:draw 3.6s linear 0.6s forwards}
  .dot{animation:travel 3.6s linear 0.6s forwards}
  .node{animation:lit .3s cubic-bezier(.2,.8,.2,1) forwards}
  .step{animation:litText .3s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes travel{to{transform:translateX(880px)}}
  @keyframes lit{to{fill:#b07a05;stroke:#b07a05}}
  @keyframes litText{to{fill:#b07a05}}
  @media (prefers-reduced-motion: reduce){
    .progress{animation:none;stroke-dashoffset:0} .dot{animation:none;transform:translateX(880px)}
    .node{animation:none;fill:#b07a05;stroke:#b07a05} .step{animation:none;fill:#b07a05}
  }
</style>
<rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="#fdfbf7" stroke="rgba(31,27,22,0.10)"/>
<text x="40" y="60" class="sans" font-size="24" font-weight="600" fill="#1f1b16">Pineapple CRM</text>
<text x="40" y="88" class="sans" font-size="17" fill="#5e554a">How one order moves, from the shop to the ad report</text>
<text x="1160" y="60" class="mono" font-size="14" fill="#7b7266" text-anchor="end">pineapple.webgrowths.com</text>
<line x1="160" y1="186" x2="1040" y2="186" stroke="#e7e1d6" stroke-width="2"/>
<line class="progress" x1="160" y1="186" x2="1040" y2="186" stroke="#b07a05" stroke-width="2"/>
<text x="160" y="154" class="mono step" font-size="14" fill="#7b7266" text-anchor="middle" style="animation-delay:0.60s">01</text>
<circle class="node" cx="160" cy="186" r="8" fill="#efe9df" stroke="#d6cec1" stroke-width="2" style="animation-delay:0.60s"/>
<text x="160" y="238" class="sans" font-size="19" font-weight="600" fill="#1f1b16" text-anchor="middle">Order comes in</text>
<text x="160" y="266" class="sans" font-size="16" fill="#5e554a" text-anchor="middle">from the WooCommerce shop</text>
<text x="380" y="154" class="mono step" font-size="14" fill="#7b7266" text-anchor="middle" style="animation-delay:1.50s">02</text>
<circle class="node" cx="380" cy="186" r="8" fill="#efe9df" stroke="#d6cec1" stroke-width="2" style="animation-delay:1.50s"/>
<text x="380" y="238" class="sans" font-size="19" font-weight="600" fill="#1f1b16" text-anchor="middle">Call and confirm</text>
<text x="380" y="266" class="sans" font-size="16" fill="#5e554a" text-anchor="middle">the team calls the customer</text>
<text x="600" y="154" class="mono step" font-size="14" fill="#7b7266" text-anchor="middle" style="animation-delay:2.40s">03</text>
<circle class="node" cx="600" cy="186" r="8" fill="#efe9df" stroke="#d6cec1" stroke-width="2" style="animation-delay:2.40s"/>
<text x="600" y="238" class="sans" font-size="19" font-weight="600" fill="#1f1b16" text-anchor="middle">Courier booked</text>
<text x="600" y="266" class="sans" font-size="16" fill="#5e554a" text-anchor="middle">Steadfast, Pathao or RedX</text>
<text x="820" y="154" class="mono step" font-size="14" fill="#7b7266" text-anchor="middle" style="animation-delay:3.30s">04</text>
<circle class="node" cx="820" cy="186" r="8" fill="#efe9df" stroke="#d6cec1" stroke-width="2" style="animation-delay:3.30s"/>
<text x="820" y="238" class="sans" font-size="19" font-weight="600" fill="#1f1b16" text-anchor="middle">Delivered</text>
<text x="820" y="266" class="sans" font-size="16" fill="#5e554a" text-anchor="middle">cash and returns tracked</text>
<text x="1040" y="154" class="mono step" font-size="14" fill="#7b7266" text-anchor="middle" style="animation-delay:4.20s">05</text>
<circle class="node" cx="1040" cy="186" r="8" fill="#efe9df" stroke="#d6cec1" stroke-width="2" style="animation-delay:4.20s"/>
<text x="1040" y="238" class="sans" font-size="19" font-weight="600" fill="#1f1b16" text-anchor="middle">Ad report</text>
<text x="1040" y="266" class="sans" font-size="16" fill="#5e554a" text-anchor="middle">which ad really sold</text>
<g class="dot"><circle cx="160" cy="186" r="16" fill="rgba(176,122,5,0.16)"/><circle cx="160" cy="186" r="6" fill="#b07a05"/></g>
</svg>
